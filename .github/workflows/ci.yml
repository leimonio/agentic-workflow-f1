name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Required check. Compares verify against the baseline from the merge base, so a known
  # failure on main does not block you, but a NEW failure does.
  gate:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is mid-migration to 26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # no --with-deps: hosted images already have the libs, and apt mirrors were unreachable from runners (2026-11-11)
      - run: npx playwright install chromium
      - run: npm run baseline
      - run: npm run gate

  # Not required. Posts the "UI Tests" / "UI Review" statuses. A human accepts or rejects in Chromatic.
  chromatic:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest is mid-migration to 26
    timeout-minutes: 20
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Chromatic
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then echo "No CHROMATIC_PROJECT_TOKEN secret: skipping Chromatic"; exit 0; fi
          npx chromatic --exit-zero-on-changes
